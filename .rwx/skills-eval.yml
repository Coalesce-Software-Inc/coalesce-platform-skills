# Skills-eval CI gate (TUC-1291 / B11) — the single source of truth.
#
# RWX owns the whole gate now: the GitHub pull_request / push triggers, the
# per-PR concurrency + cancel-in-progress, the retrigger guard, AND the eval
# itself. (Previously the GitHub Action `.github/workflows/skills-eval.yml`
# owned the triggers and fired this via `rwx run`; that file has been removed
# and its responsibilities folded in here — see the `on:` and `guard` blocks.)
#
# Requires the RWX GitHub App to be installed on
# Coalesce-Software-Inc/coalesce-platform-skills so these `on.github` triggers
# fire and the run reports back as a required check.
#
# What this workflow does (plan steps 3-7):
#   0.  Retrigger guard: skip the eval when the head commit is the ledger-only
#       commit-back this workflow itself pushed (marker `[skills-eval ledger]`),
#       so the commit in step 7 doesn't loop forever.
#   3.  Fetch the eval harness from eng-ops at a pinned SHA -> `toolbelt` on PATH.
#   3.5 Install the latest published coa (@next) so the offline eval is meaningful.
#   4.  Matrix: {opus-4-8, sonnet-5, haiku-4-5} each run the full offline suite
#       across the bare/skills/claude_md arms, emitting a per-model CSV fragment.
#   5.  Aggregate: stamp + append rows to history/runs.csv, regenerate rollup.md.
#   6.  Regression check: relative rule; PR comment + annotations; FAIL iff a
#       safety case regressed.
#   7.  Commit history/** back to the PR branch as the CI bot (the guard above
#       stops that commit from retriggering the suite).
#
# "Offline" still drives real headless Claude agents (only Snowflake is stubbed),
# so this costs API tokens and is non-deterministic — hence quality regressions
# are advisory and only safety regressions block.
#
# Nothing here ships to customers: install.sh only copies skills/coalesce-*.
#
# Local iteration:
#   rwx lint .rwx/skills-eval.yml
#   rwx run  .rwx/skills-eval.yml \
#     --init skills-sha=<sha> --init harness-sha=<sha> \
#     --init pr-number=123 --init base-ref=develop --init commit-ledger=false --open

on:
  # --- GitHub triggers (formerly the GitHub Action's job) --------------------
  github:
    # PRs. Actions mirror the old GHA:
    #   opened/reopened/synchronize + ready_for_review (draft -> ready).
    # The draft check is the RWX-native equivalent of the GHA
    # `pull_request.draft == false` guard: don't spend ~250 model calls on a
    # draft PR; the ready_for_review action kicks off the run once it's ready.
    pull_request:
      actions: [opened, reopened, synchronize, ready_for_review]
      if: ${{ event.github.pull_request.pull_request.draft == false }}
      init:
        skills-sha: ${{ event.git.sha }}
        # Pinned eng-ops harness under test — the contract with B12 (RND-316).
        # `main` is the floating fallback; pin a real eng-ops SHA for repro.
        harness-sha: main
        pr-number: ${{ event.github.pull_request.number }}
        base-ref: develop
        # PR head branch — where the ledger row is committed back to, and the
        # concurrency-pool key so a new push cancels the superseded run.
        head-ref: ${{ event.git.branch }}
        commit-ledger: "true"
        concurrency-pool-name: ${{ event.git.branch }}

    # Canonical timeline: pushes to develop write the ledger row onto develop.
    # Feature-branch pushes are handled by the pull_request trigger above, so
    # gate this to develop to avoid double-triggering.
    push:
      if: ${{ event.git.branch == 'develop' }}
      init:
        skills-sha: ${{ event.git.sha }}
        harness-sha: main
        pr-number: ""
        base-ref: develop
        head-ref: ${{ event.git.branch }}
        commit-ledger: "true"
        concurrency-pool-name: ${{ event.git.branch }}

  # Bare `rwx run .rwx/skills-eval.yml` for a quick local shakeout (no flags).
  cli:
    init:
      skills-sha: develop
      # Pin of the eng-ops harness under test — the contract with B12 (RND-316).
      # The harness lives in eng-ops (a DIFFERENT repo, cloned by harness-code),
      # whose primary branch is `main` — NOT this repo's `develop`. Pin a real
      # eng-ops SHA for reproducible runs; the value lands in the ledger's
      # harness_sha column. `main` is the floating fallback for local shakeouts.
      harness-sha: main
      pr-number: ""
      base-ref: develop
      # The PR's head branch — where the ledger row is committed back to.
      head-ref: develop
      # Local/manual runs default to NOT committing the ledger back.
      commit-ledger: "false"
      # Concurrency-pool key. The github triggers override this with the PR head
      # branch so a new push cancels the superseded run (see concurrency-pools
      # below). Defaults to the run id so a bare local `rwx run` gets its own
      # pool and never cancels (or is cancelled by) another run.
      concurrency-pool-name: ${{ run.id }}

  # Named dispatch so other run definitions / the UI can trigger a one-off
  # (the equivalent of the old GHA `workflow_dispatch`).
  dispatch:
    key: skills-eval
    params:
      - key: skills-sha
        name: skills repo ref
        description: "Ref of coalesce-platform-skills to evaluate"
        default: develop
        required: true
      - key: harness-sha
        name: eng-ops harness ref
        description: "Pinned eng-ops ref (repo primary branch is `main`) providing `toolbelt skills-eval`"
        default: main
        required: true
    init:
      skills-sha: ${{ event.dispatch.params.skills-sha }}
      harness-sha: ${{ event.dispatch.params.harness-sha }}
      pr-number: ""
      base-ref: develop
      head-ref: ${{ event.dispatch.params.skills-sha }}
      commit-ledger: "false"
      # A manual one-off gets its own pool (unique per run) so it neither cancels
      # nor is cancelled by a PR-triggered run.
      concurrency-pool-name: ${{ run.id }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.0.2

# Vault holding the eval secret: VERTEX_SA_SECRET (Vertex AI service-account
# credentials, used by all three models).
tool-cache:
  vault: coalesce-develop

# One in-flight skills-eval run per PR branch. `concurrency-pool-name` is the PR
# head branch for github-triggered runs and the run id for ad-hoc CLI/dispatch
# runs. A new commit to the same branch cancels the superseded ~250-call suite.
concurrency-pools:
  - id: Coalesce-Software-Inc/coalesce-platform-skills:${{ init.concurrency-pool-name }}
    capacity: 1
    on-overflow: cancel-running

tasks:
  # --- 3. Fetch the skills package under test + the harness -------------------
  - key: skills-code
    call: git/clone 2.0.7
    with:
      repository: https://github.com/Coalesce-Software-Inc/coalesce-platform-skills.git
      ref: ${{ init.skills-sha }}
      github-token: ${{ github.token }}
      # Keep .git so the guard can inspect the head commit and the ledger-commit
      # task can push back to the PR branch.
      preserve-git-dir: true
      fetch-full-depth: true

  # --- 0. Retrigger guard (formerly the GitHub Action's `guard` job) ----------
  # "Every run commits a ledger row" would loop forever without this. The
  # commit-ledger task (step 7) pushes a history/**-only commit carrying the
  # `[skills-eval ledger]` marker; when the triggering commit is exactly that,
  # skip the eval. Works for both retrigger paths — a PR:synchronize (ledger
  # push to a PR head branch) and a push to develop — because it inspects the
  # checked-out git head, not the trigger type.
  #
  # This MUST be an explicit head-commit check, not path-based filtering: on
  # synchronize the whole PR diff still contains the earlier real changes, so a
  # path filter would never skip. Only the head commit itself is examined.
  - key: guard
    use: [skills-code]
    run: |
      set -euo pipefail
      SHA="$(git rev-parse HEAD)"
      MSG="$(git log -1 --format='%s%n%b' "$SHA")"
      # Files changed by the head commit only (not the whole PR diff).
      CHANGED="$(git diff --name-only "${SHA}^" "${SHA}" || git show --name-only --format= "$SHA")"
      echo "Head commit: $SHA"
      echo "Changed files:"; echo "$CHANGED"

      ONLY_HISTORY=true
      while IFS= read -r f; do
        [ -z "$f" ] && continue
        case "$f" in
          history/*) : ;;
          *) ONLY_HISTORY=false ;;
        esac
      done <<< "$CHANGED"

      IS_LEDGER_COMMIT=false
      case "$MSG" in
        *"[skills-eval ledger]"*) IS_LEDGER_COMMIT=true ;;
      esac

      if [ "$ONLY_HISTORY" = true ] && [ "$IS_LEDGER_COMMIT" = true ]; then
        echo "Ledger-only commit detected — skipping eval to avoid retrigger loop."
        printf 'false' > "$RWX_VALUES/should-run"
      else
        printf 'true' > "$RWX_VALUES/should-run"
      fi
    outputs:
      values:
        - should-run

  - key: harness-code
    call: git/clone 2.0.7
    with:
      repository: https://github.com/Coalesce-Software-Inc/eng-ops.git
      ref: ${{ init.harness-sha }}
      github-token: ${{ github.token }}
      path: eng-ops

  - key: python
    call: python/install 1.4.2
    with:
      python-version: "3.11.9"

  - key: node
    call: nodejs/install 1.1.14
    with:
      node-version: 20.19.4

  # Install the harness (`toolbelt skills-eval run`) from the pinned eng-ops.
  - key: harness
    use: [harness-code, python]
    run: |
      set -euo pipefail
      cd eng-ops
      pip install -e '.[dev]'
      toolbelt skills-eval --help >/dev/null

  # --- 3.5 Latest published coa; offline stand-in on PATH ---------------------
  # coa@next is what makes the offline eval meaningful (describe/validate pass
  # through the real CLI). The harness's offline mode wraps it to stub Snowflake
  # (coa create/run are faked), so no warehouse creds are needed here.
  - key: coa
    use: [node]
    run: |
      set -euo pipefail
      npm install -g @coalescesoftware/coa@next
      coa --version

  # The harness drives real headless agents by shelling out to the `claude` CLI
  # (Claude Code), so it must be on PATH. Without it the harness dies with
  # `[Errno 2] No such file or directory: 'claude'`.
  - key: claude-cli
    use: [node]
    run: |
      set -euo pipefail
      npm install -g @anthropic-ai/claude-code
      claude --version

  # --- 4. Model matrix -------------------------------------------------------
  # RWX is a task DAG, not a value-matrix engine, so we instantiate one task per
  # model (a shared anchor keeps them identical apart from the model id). Each
  # runs the full suite over all arms and writes one results.jsonl (under
  # fragments/<model-id>/). `parallel` would shard a single model's cases
  # further if wall-clock needs it.
  #
  # `if:` on the guard short-circuits the whole matrix (and everything that
  # `use`s it) when a ledger-only retrigger commit is detected.
  - &eval-model
    key: eval-opus
    use: [skills-code, harness, coa, claude-cli, guard]
    if: ${{ tasks.guard.values.should-run == 'true' }}
    # Raised from RWX's 10-minute default: one model runs the full suite (both
    # arms) and, even with concurrent agents, the slow models (opus/sonnet) need
    # more than 10 minutes. Concurrency (--jobs below) cuts wall-clock; this is
    # the headroom so a legitimately long run isn't killed mid-flight.
    timeout: 30m
    env: &eval-env
      # Raw Vertex service-account JSON. GOOGLE_APPLICATION_CREDENTIALS must be a
      # *file path*, not inline JSON, so the run script below writes this out to a
      # file and points GOOGLE_APPLICATION_CREDENTIALS at it for the Vertex client.
      VERTEX_SA_JSON:
        value: ${{ secrets.VERTEX_SA_SECRET }}
        cache-key: excluded
      MODEL_ID: claude-opus-4-8
    run: |
      set -euo pipefail
      # Materialize the raw service-account JSON to a file (0600) and expose it as
      # GOOGLE_APPLICATION_CREDENTIALS — Google auth libs expect a path, not JSON.
      SA_FILE="$HOME/vertex-sa.json"
      printf '%s' "$VERTEX_SA_JSON" > "$SA_FILE"
      chmod 600 "$SA_FILE"
      export GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE"
      # The claude_md condition arm injects this workspace's context doc
      # (CLAUDE.md / AGENT.md). Without SKILLS_EVAL_CONTEXT_DIR the harness falls
      # back to an eng-ops dev's local checkout path, which doesn't exist in CI —
      # point it at the skills-code checkout ($PWD), whose root holds CLAUDE.md.
      export SKILLS_EVAL_CONTEXT_DIR="$PWD"
      mkdir -p "fragments/${MODEL_ID}"
      # Offline suite: real Claude agents, stubbed Snowflake. "Offline" is the
      # default case tier (the sandbox stubs coa create/run) — there is no
      # --offline flag; live-tier cases are what opt in and need --connection.
      # Guardrail/safety cases override their own rep count in case.yml, so
      # there is no separate --safety-reps flag. --no-record keeps the harness
      # from writing its own history/runs.csv; the workflow ledger is owned by
      # .rwx/scripts/eval_ledger.py in the aggregate task.
      #
      # --jobs raises the harness's concurrent-agent count (default 4). Agents
      # are API-I/O-bound, not CPU-bound, so this scales well; the practical
      # ceiling is task memory (each agent spawns a claude + coa subprocess).
      # Start at 8 and tune with the timeout above if a model still crowds it.
      toolbelt skills-eval run \
        --skills-dir "$PWD" \
        --condition bare --condition skills \
        --model "$MODEL_ID" \
        --reps 1 \
        --jobs 8 \
        --no-record \
        --results-dir "fragments/${MODEL_ID}"
    outputs:
      artifacts:
        - key: fragment-opus
          path: fragments

  - <<: *eval-model
    key: eval-sonnet
    env:
      <<: *eval-env
      MODEL_ID: claude-sonnet-5
    outputs:
      artifacts:
        - key: fragment-sonnet
          path: fragments

  - <<: *eval-model
    key: eval-haiku
    env:
      <<: *eval-env
      MODEL_ID: claude-haiku-4-5
    outputs:
      artifacts:
        - key: fragment-haiku
          path: fragments

  # --- 5 + 6. Aggregate, append ledger, regenerate rollup, gate --------------
  # `use:` the skills checkout (existing history/) + all three model tasks (their
  # fragment artifacts). eval_ledger.py stamps run metadata, appends runs.csv,
  # regenerates rollup.md, applies the relative regression rule, writes the PR
  # comment, and exits 2 iff a SAFETY case regressed.
  #
  # Skipped automatically when the guard skips the eval tasks (a `use`d task that
  # didn't run cascades the skip), so a ledger-only retrigger is a clean no-op.
  - key: aggregate
    use: [skills-code, python, eval-opus, eval-sonnet, eval-haiku]
    env:
      SKILLS_SHA: ${{ init.skills-sha }}
      HARNESS_SHA: ${{ init.harness-sha }}
    run: |
      set -euo pipefail
      mkdir -p out
      RUN_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      set +e
      python3 .rwx/scripts/eval_ledger.py \
        --results-glob 'fragments/*/results.jsonl' \
        --ledger history/runs.csv \
        --rollup history/rollup.md \
        --comment out/scorecard.md \
        --run-ts "$RUN_TS" \
        --skills-sha "$SKILLS_SHA" \
        --harness-sha "$HARNESS_SHA"
      GATE_RC=$?
      set -e
      cat out/scorecard.md
      echo "$GATE_RC" > "$RWX_VALUES/gate-rc"
      # history/ (from the checkout, updated in place by eval_ledger.py) and
      # out/scorecard.md are already at the working-dir paths the outputs.artifacts
      # block below declares, so RWX uploads them directly — no copy needed.
      # Non-zero here fails the aggregate task -> the whole run -> the PR check.
      exit "$GATE_RC"
    outputs:
      artifacts:
        - key: ledger
          path: history
        - key: scorecard
          path: out/scorecard.md

  # --- 6b. PR comment --------------------------------------------------------
  # Post the scorecard diff to the PR (skipped for non-PR runs). Runs whether the
  # gate passed or failed so reviewers always see the trend.
  - key: pr-comment
    use: [skills-code, aggregate]
    after: ${{ aggregate.succeeded || aggregate.failed }}
    if: ${{ init.pr-number != '' }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ init.pr-number }}
    run: |
      set -euo pipefail
      sudo apt-get update && sudo apt-get install -y --no-install-recommends gh
      gh pr comment "$PR_NUMBER" \
        --repo Coalesce-Software-Inc/coalesce-platform-skills \
        --body-file out/scorecard.md
    outputs:
      filesystem: false

  # --- 7. Commit the ledger back to the PR branch ----------------------------
  # Guarded by the retrigger check above: this commit's message carries the
  # `[skills-eval ledger]` marker and touches only history/**, so the next
  # pull_request:synchronize (or push to develop) is short-circuited by the
  # `guard` task before it triggers the suite again. Runs even when the gate
  # failed (the ledger row is the record of the regression) — only skipped when
  # the caller didn't ask to commit or nothing changed.
  - key: commit-ledger
    use: [skills-code, aggregate]
    after: ${{ aggregate.succeeded || aggregate.failed }}
    if: ${{ init.commit-ledger == 'true' && init.head-ref != '' }}
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ init.head-ref }}
    run: |
      set -euo pipefail
      git config user.name  "coalesce-ci-bot"
      git config user.email "coalesce-ci-bot@users.noreply.github.com"
      git add history/
      if git diff --cached --quiet; then
        echo "No ledger changes to commit."
        exit 0
      fi
      git commit -m "chore(skills-eval): update run ledger [skills-eval ledger] [skip ci]"
      git push origin "HEAD:${BRANCH}"
    outputs:
      filesystem: false
