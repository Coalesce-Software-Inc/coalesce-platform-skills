# Manually trigger the RWX skills-eval suite from the GitHub UI (Actions tab ->
# "Trigger skills-eval (RWX)" -> Run workflow) or via `gh workflow run`.
#
# This does NOT run the eval itself — the eval lives entirely in RWX
# (.rwx/skills-eval.yml). This workflow just calls RWX's dispatch API against
# the `skills-eval` dispatch key, forwarding the chosen arms and refs. RWX then
# runs the matrix, comments the scorecard on any PR, and (for dispatch runs)
# does NOT commit the ledger back.
#
# Requirements:
#   - Repo/org secret RWX_ACCESS_TOKEN: an RWX personal or organization access
#     token with permission to dispatch runs in the RWX org that owns the
#     `skills-eval` dispatch key.
#
# See RWX dispatch docs: https://www.rwx.com/docs/mint/dispatch-triggers
name: Trigger skills-eval (RWX)

on:
  workflow_dispatch:
    inputs:
      # Arm selection. Each maps to a `--condition <arm>` flag in the RWX
      # matrix. At least one must be enabled or the run is rejected below.
      arm_bare:
        description: "Arm: bare (no skills, no CLAUDE.md)"
        type: boolean
        default: true
      arm_skills:
        description: "Arm: skills (skills package installed)"
        type: boolean
        default: true
      skills_ref:
        description: "coalesce-platform-skills branch (or tag / SHA) to evaluate"
        type: string
        default: develop
      harness_sha:
        description: "eng-ops harness ref providing `toolbelt skills-eval` (repo default branch is main)"
        type: string
        default: main

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Assemble selected arms
        id: arms
        run: |
          set -euo pipefail
          conditions=""
          [ "${{ inputs.arm_bare }}" = "true" ]      && conditions="$conditions bare"
          [ "${{ inputs.arm_skills }}" = "true" ]    && conditions="$conditions skills"
          # Trim leading/trailing whitespace.
          conditions="$(echo "$conditions" | xargs)"
          if [ -z "$conditions" ]; then
            echo "::error::No arms selected — enable at least one of bare / skills."
            exit 1
          fi
          echo "Selected arms: $conditions"
          echo "conditions=$conditions" >> "$GITHUB_OUTPUT"

      - name: Dispatch RWX skills-eval run
        env:
          RWX_ACCESS_TOKEN: ${{ secrets.RWX_ACCESS_TOKEN }}
          CONDITIONS: ${{ steps.arms.outputs.conditions }}
          SKILLS_REF: ${{ inputs.skills_ref }}
          HARNESS_SHA: ${{ inputs.harness_sha }}
        run: |
          set -euo pipefail
          if [ -z "${RWX_ACCESS_TOKEN:-}" ]; then
            echo "::error::RWX_ACCESS_TOKEN secret is not set."
            exit 1
          fi

          # Build the request body. params keys must match the dispatch `params`
          # declared in .rwx/skills-eval.yml (skills-sha, harness-sha, conditions).
          # `ref` picks which branch's run definition RWX loads; the skills-sha
          # param makes the clone task check out that same ref — so evaluating a
          # branch is just passing that branch name here.
          BODY="$(jq -n \
            --arg skills   "$SKILLS_REF" \
            --arg harness  "$HARNESS_SHA" \
            --arg conds    "$CONDITIONS" \
            --arg title    "skills-eval (arms: $CONDITIONS) @ $SKILLS_REF" \
            '{
               key: "skills-eval",
               ref: $skills,
               title: $title,
               params: {
                 "skills-sha":  $skills,
                 "harness-sha": $harness,
                 "conditions":  $conds
               }
             }')"

          echo "Dispatching skills-eval to RWX with arms: $CONDITIONS"
          RESP="$(curl --fail-with-body -sS -X POST \
            https://cloud.rwx.com/mint/api/runs/dispatches \
            -H "Authorization: Bearer ${RWX_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "$BODY")"
          echo "$RESP"

          # The dispatch endpoint returns {"dispatch_id": "..."}; poll
          # GET /runs/dispatches/:id until status=ready, then surface the run
          # URL. Poll shape: {"status":"ready","runs":[{"run_id","run_url"}]}.
          DISPATCH_ID="$(echo "$RESP" | jq -r '.dispatch_id // empty')"
          if [ -z "$DISPATCH_ID" ]; then
            echo "::warning::Could not parse a dispatch_id from the response; the run may still have been created. Check the RWX UI."
            exit 0
          fi

          echo "Dispatch id: $DISPATCH_ID — polling for the run id..."
          RUN_URL=""
          for _ in $(seq 1 30); do
            POLL="$(curl --fail-with-body -sS \
              "https://cloud.rwx.com/mint/api/runs/dispatches/${DISPATCH_ID}" \
              -H "Authorization: Bearer ${RWX_ACCESS_TOKEN}" \
              -H "Accept: application/json")"
            STATUS="$(echo "$POLL" | jq -r '.status // empty')"
            if [ "$STATUS" = "ready" ]; then
              RUN_URL="$(echo "$POLL" | jq -r '.runs[0].run_url // empty')"
              break
            elif [ "$STATUS" = "error" ]; then
              echo "::error::RWX dispatch failed: $(echo "$POLL" | jq -r '.error // "unknown error"')"
              exit 1
            fi
            sleep 2
          done

          {
            echo "### RWX skills-eval dispatched"
            echo ""
            echo "- **Arms:** \`$CONDITIONS\`"
            echo "- **skills ref:** \`$SKILLS_REF\`"
            echo "- **harness ref:** \`$HARNESS_SHA\`"
            if [ -n "$RUN_URL" ]; then
              echo "- **Run:** $RUN_URL"
            else
              echo "- **Run:** not yet available — check the RWX Cloud UI."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
