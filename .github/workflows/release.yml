# Bump the Claude Plugin version and publish a release.
name: Release

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      bump-type:
        description: "Bump version"
        required: true
        type: choice
        default: Patch
        options:
          - Patch
          - Minor
          - Major

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    steps:
      
      - name: Require the release App credentials
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Set the RELEASE_APP_ID variable and RELEASE_APP_PRIVATE_KEY secret. See the note at the top of this workflow."
            exit 1
          fi

      - name: Mint the App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
    
          ref: develop
          # Tags are the version input
          fetch-depth: 0

      - name: Refuse to release from anywhere but develop
        run: |
          if [ "$GITHUB_REF_NAME" != "develop" ]; then
            echo "::error::This workflow releases from develop only, but ran on '$GITHUB_REF_NAME'."
            exit 1
          fi

      - name: Get the previous tag
        id: previoustag
        uses: WyriHaximus/github-action-get-previous-tag@27c04b107bd8de27966ed909e0992078a9121de8 # v1
        with:
          # Tags in this repo are bare semver, no `v` prefix.
          fallback: 0.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the candidate versions
        id: semvers
        uses: WyriHaximus/github-action-next-semvers@1b773ddb3831644dabc80ef5e791ebd4925f7651 # v1
        with:
          version: ${{ steps.previoustag.outputs.tag }}

      - name: Choose the next version
        id: version
        env:
          BUMP: ${{ inputs.bump-type || 'Patch' }}
          PATCH: ${{ steps.semvers.outputs.patch }}
          MINOR: ${{ steps.semvers.outputs.minor }}
          MAJOR: ${{ steps.semvers.outputs.major }}
          PREVIOUS: ${{ steps.previoustag.outputs.tag }}
        run: |
          case "$BUMP" in
            Patch) next="$PATCH" ;;
            Minor) next="$MINOR" ;;
            Major) next="$MAJOR" ;;
            *) echo "::error::Unknown bump type '$BUMP'."; exit 1 ;;
          esac
          echo "next=$next" >>"$GITHUB_OUTPUT"
          echo "Releasing $next (previous tag: $PREVIOUS, bump: $BUMP)"

      - name: Bump the version in both manifests
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: .github/scripts/prepare-release.sh "$VERSION"

      - name: Verify the version invariants
        run: .github/scripts/check-version-consistency.sh

      - name: Commit, tag and push
        id: push
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          # A run queued behind another sees a tip the run ahead already released;
          # cutting a second version for it would hand users an identical package
          # under a new number. A manual run is a deliberate decision, so it stands.
          if [ "$GITHUB_EVENT_NAME" = push ] && tag=$(git describe --exact-match --tags HEAD 2>/dev/null); then
            echo "::notice::develop's tip is already released as $tag. Nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json .claude-plugin/marketplace.json
          git commit -m "chore(release): $VERSION [skip ci]"

          # Branch and tag go up atomically: marketplace.json now points at $VERSION,
          # so a develop carrying the bump without the tag is one nobody can install
          # from. A merge can still land mid-run, so replay the bump onto the new tip
          # and retry, re-cutting the tag to follow it. Only this job makes tags and
          # only one runs at a time, so the computed version survives the rebase.
          for attempt in 1 2 3; do
            git tag -f -a "$VERSION" -m "Release $VERSION"
            if git push --atomic origin HEAD:refs/heads/develop "refs/tags/$VERSION"; then
              echo "released=true" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::develop moved during this run. Rebasing onto it (attempt $attempt)."
            git pull --rebase origin develop
          done

          echo "::error::develop kept moving while this run tried to release $VERSION. Re-run the workflow."
          exit 1

      - name: Publish the GitHub release
        if: steps.push.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.next }}
        run: gh release create "$VERSION" --title "$VERSION" --generate-notes

      - name: Summarize
        if: steps.push.outputs.released == 'true'
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          {
            echo "### Released \`$VERSION\`"
            echo ""
            echo "Users receive it with:"
            echo ""
            echo '```sh'
            echo "claude plugin marketplace update coalesce"
            echo "claude plugin update coalesce-platform-skills"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
